name: Verify data, metrics and saved models
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            research/requirements-tested.txt
      - name: Install measured dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify dataset, metrics, links and checkpoint inference
        run: python scripts/verify_repository.py
